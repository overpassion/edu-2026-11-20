# ===================================================================
# eGovFrame 5.0 Boot 게시판 애플리케이션 설정
# ===================================================================
spring.application.name=board-app
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -------------------------------------------------------------------
# DataSource - 내장 HSQLDB (in-memory)
# -------------------------------------------------------------------
spring.datasource.driver-class-name=org.hsqldb.jdbcDriver
spring.datasource.url=jdbc:hsqldb:mem:egovboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# SQL init - 기동 시 스키마/더미데이터 자동 로드
# -------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=false

# -------------------------------------------------------------------
# MyBatis
# -------------------------------------------------------------------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.egovframe.sample.board.model
mybatis.configuration.map-underscore-to-camel-case=true

# -------------------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# 파일 업로드 (multipart)
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# 첨부파일 저장 경로 (실행 위치 기준 상대경로. 없으면 자동 생성)
egov.upload.dir=upload-files

# -------------------------------------------------------------------
# 로그
# -------------------------------------------------------------------
logging.level.org.egovframe.sample.board=DEBUG
logging.level.java.sql=DEBUG
